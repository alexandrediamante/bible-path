name: bible_path
description: An offline-first Bible companion PWA for personal use.
version: 2026.11.0+0
publish_to: none

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  go_router: ^14.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.2.0
  intl: ^0.20.3
  uuid: ^4.5.3
  url_launcher: ^6.3.2
  share_plus: ^10.0.0
  google_sign_in: ^6.2.0
  firebase_auth: ^5.3.0
  firebase_core: ^3.6.0
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.0
  path: ^1.9.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/bible/
    - assets/content/
    - assets/json/listen/
    - assets/json/read/
    - assets/json/study/
    - assets/json/watch/
    - assets/lent/
    - assets/json/advent/
